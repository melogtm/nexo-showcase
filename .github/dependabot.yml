version: 2
updates:
  # Cooldown: a release must be public for 7 days before it is proposed (most malicious versions are pulled sooner).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # @types/node tracks the Node major we run on (engines: >=22), not the latest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
