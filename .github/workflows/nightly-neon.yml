name: nightly-neon
# The E2E suite on real Neon (prod's Postgres version and pooler), on a branch of the prod project that Neon deletes
# by itself one hour later, even if this job dies before its cleanup step.
# The branch copies prod's data, which invariant 7 keeps synthetic. If real CNIS ever reach prod, branch from an empty parent instead.
on:
  schedule: [{ cron: "23 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
concurrency: nightly-neon # one branch at a time: the free plan's branch limit is what ended the PR previews
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "EXPIRES_AT=$(date -u --date '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: nightly-e2e-${{ github.run_id }}
          expires_at: ${{ env.EXPIRES_AT }}
      # 1) Pending migrations apply cleanly on a copy of prod's data, before Vercel runs them for real.
      - run: npm run db:migrate
        env: { DATABASE_URL: "${{ steps.branch.outputs.db_url }}" }
      # 2) Then an empty database, migrated from zero, for the E2E suite (the board specs expect no lawsuits yet).
      - run: |
          [ -n "$DATABASE_URL" ] || { echo "no branch URL"; exit 1; } # fail closed: psql would fall back to a default target
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS drizzle CASCADE;'
          npm run db:migrate
        env: { DATABASE_URL: "${{ steps.branch.outputs.db_url }}" }
      - run: npm run build
        env: { NEXO_COVERAGE: "1" }
      - run: npx playwright install --with-deps chromium
      # The app talks to Neon's pooler, as in prod.
      - run: npm run e2e
        env: { E2E_DATABASE_URL: "${{ steps.branch.outputs.db_url_pooled }}", NEXO_PASSWORD: nightly }
      - if: always() && steps.branch.outputs.branch_id
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-report
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/
          retention-days: 7
