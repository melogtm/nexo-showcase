name: postdeploy
# Vercel reports each deploy as a GitHub deployment; after a successful Production one, smoke the live site.
on: deployment_status
permissions:
  contents: read
jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.event.deployment.sha }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Read-only GETs; never sends CRON_SECRET, so it can't trigger a (paid) Jusbrasil sync.
      - run: npm run smoke -- "$PROD_URL"
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          NEXO_USER: ${{ vars.NEXO_PROD_USER || 'nexo' }}
          NEXO_PASSWORD: ${{ secrets.NEXO_PROD_PASSWORD }}
